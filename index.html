<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爆火视频文案生产器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
    <style>
      :root {
        /* Apple/Stripe 融合设计系统 */
        /* 基础色 */
        --bg-primary: #050507;
        --bg-secondary: rgba(255, 255, 255, 0.06);
        --bg-tertiary: rgba(255, 255, 255, 0.1);
        --text-primary: #f8f9fa;
        --text-secondary: rgba(248, 249, 250, 0.65);
        --text-tertiary: rgba(248, 249, 250, 0.45);
        --border-primary: rgba(255, 255, 255, 0.15);
        --border-secondary: rgba(255, 255, 255, 0.08);
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        --accent-gradient-text: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.4);
        --shadow-medium: 0 12px 40px rgba(0, 0, 0, 0.5);
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;

        /* 兼容旧 CSS 变量引用 */
        --color-background-primary: var(--bg-primary);
        --color-background-secondary: var(--bg-secondary);
        --color-text-primary: var(--text-primary);
        --color-text-secondary: var(--text-secondary);
        --color-text-tertiary: var(--text-tertiary);
        --color-border-tertiary: var(--border-primary);
        --color-border-secondary: var(--border-secondary);
        --border-radius-md: var(--radius-md);
        --border-radius-lg: var(--radius-lg);
        --font-sans: -apple-assistant, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif;
        --font-mono: 'SF Mono', 'SFMono-Regular', 'Menlo', 'Consolas', monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-primary);
        background-image:
          radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-family: -apple-assistant, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      #app {
        width: 100%;
        max-width: 760px;
        padding: 40px 24px;
      }
      /* 全局平滑动画 */
      * {
        transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
